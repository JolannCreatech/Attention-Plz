<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Code — traducteur minion</title>
  <link rel="stylesheet" href="style.css?v=2" />
  <link rel="stylesheet" href="code.css?v=2" />
</head>
<body class="page-code">

  <main class="code">
    <header class="code__entete">
      <a class="code__retour" href="index.html">
        <span aria-hidden="true">←</span> Traducteur
      </a>
      <h1 class="code__titre">&lt;/&gt; Code du projet</h1>
      <p class="code__sous-titre">Parcours les dossiers et lis les fichiers du dépôt.</p>
    </header>

    <div class="code__corps">
      <aside class="explorateur" aria-label="Fichiers du projet">
        <nav class="fil" id="fil" aria-label="Chemin du dossier"></nav>
        <ul class="explorateur__liste" id="liste"></ul>
      </aside>

      <section class="lecteur" aria-live="polite">
        <div class="lecteur__entete">
          <p class="lecteur__nom" id="nom-fichier">Aucun fichier sélectionné</p>
          <p class="lecteur__meta" id="meta-fichier"></p>
        </div>
        <div class="lecteur__contenu" id="contenu">
          <p class="lecteur__vide">Choisis un fichier à gauche pour l’afficher.</p>
        </div>
      </section>
    </div>

    <p class="code__erreur" id="erreur" role="alert" hidden></p>
  </main>

  <script src="code.js?v=2"></script>
</body>
</html>
