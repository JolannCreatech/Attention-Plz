<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Traducteur minion</title>
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <main class="scene">

    <!-- Petites lueurs, purement décoratives -->
    <div class="lucioles" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i>
    </div>

    <!-- Le texte d'origine, rappelé discrètement -->
    <p class="echo" id="echo" hidden></p>

    <!-- La bulle : c'est ici que la traduction s'affiche -->
    <section class="bulle" id="bulle" data-state="idle" aria-live="polite">
      <p class="bulle__texte" id="bulle-texte">Bello ! Écris en français, et en minion je te le dis !</p>
    </section>

    <!-- Le personnage. Tout est en CSS, aucune image. -->
    <div
      class="minion"
      id="minion"
      role="button"
      tabindex="0"
      aria-label="Minion — clique pour le faire réagir"
      title="Clique-moi, tu peux"
    >
      <span class="minion__hair" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="minion__arm minion__arm--left" aria-hidden="true"></span>
      <span class="minion__arm minion__arm--right" aria-hidden="true"></span>

      <div class="minion__body" aria-hidden="true">
        <div class="minion__strap"></div>

        <span class="minion__straps" aria-hidden="true"><i></i><i></i></span>

        <div class="minion__goggles">
          <div class="minion__goggle"><div class="eye"><span class="iris"></span></div></div>
          <div class="minion__goggle"><div class="eye"><span class="iris"></span></div></div>
        </div>

        <div class="minion__mouth" id="mouth">
          <div class="mouth__inner"></div>
          <div class="mouth__teeth"></div>
          <div class="mouth__tongue"></div>
        </div>

        <div class="minion__overalls">
          <div class="overalls__bib">
            <div class="overalls__pocket"><span class="overalls__logo">G</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Le sens de traduction -->
    <button class="sens" id="sens" type="button">
      <span class="sens__icone" aria-hidden="true">⇄</span>
      <span class="sens__texte" id="sens-texte">Français → Minion</span>
    </button>

    <!-- La zone de saisie -->
    <form class="ask" id="ask" autocomplete="off" novalidate onsubmit="return false;">
      <label class="sr-only" for="question">Texte à traduire</label>
      <input
        id="question"
        name="question"
        type="text"
        placeholder="Bonjour mon ami !"
        maxlength="220"
        autocomplete="off"
        spellcheck="false"
        autofocus
      />
      <button type="button" id="send" aria-label="Traduire">
        <span aria-hidden="true">→</span>
      </button>
    </form>

    <!-- État de la connexion au serveur du modèle (cliquable pour réessayer) -->
    <p class="etat" id="etat" data-etat="attente" role="status" title="Cliquer pour vérifier à nouveau">connexion au modèle…</p>

  </main>

  <!-- Secours : si script.js ne se charge pas, on le dit au lieu de laisser le
       formulaire recharger la page avec ?question=... -->
  <script>
    setTimeout(function () {
      if (!window.__minionPret) {
        var t = document.getElementById('bulle-texte');
        var e = document.getElementById('etat');
        if (t) t.textContent = "L'interface n'a pas pu démarrer. Ouvre la console (F12) pour voir l'erreur.";
        if (e) { e.dataset.etat = 'ko'; e.textContent = 'script.js non chargé'; }
      }
    }, 2500);
  </script>
  <script src="script.js?v=7"></script>
</body>
</html>
